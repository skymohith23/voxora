buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Use 8.3.0 to match Gradle 8.8
        classpath("com.android.tools.build:gradle:8.3.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

// REMOVED: id("com.facebook.react.rootproject") - This is 0.84 only!

allprojects {
    repositories {
        maven {
            url("$rootDir/../node_modules/react-native/android")
        }
        maven {
            url("$rootDir/../node_modules/jsc-android/dist")
        }
        mavenCentral()
        google()
        maven { url "https://www.jitpack.io" }
    }
}
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // 1. Identity Fallback
                if (namespace == null) {
                    try {
                        namespace = project.group
                    } catch (Exception e) {
                        namespace = "com.voxora.generated.${project.name.replace("-", "_")}"
                    }
                }

                // 2. JAVA SIDE: Force Java 17
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            // 3. KOTLIN SIDE: Force JVM Target 17 + Metadata Fix
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "17"
                    freeCompilerArgs += [
                        "-Xskip-prerelease-check", 
                        "-Xallow-unstable-dependencies",
                        "-Xno-call-assertions",
                        "-Xno-param-assertions"]
                }
            }

            // 4. Manifest Stripping Fix
            project.tasks.matching { it.name.startsWith("process") && it.name.endsWith("Manifest") }.configureEach {
                doFirst {
                    def manifestFile = file("${project.projectDir}/src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def content = manifestFile.getText('UTF-8')
                        if (content.contains('package=')) {
                            println "STABLE-FIX: Stripping package attribute from ${project.name}"
                            content = content.replaceAll(/package="[^"]*"/, '')
                            manifestFile.write(content, 'UTF-8')
                        }
                    }
                }
            }
        }
    }
}

// 5. RESOLUTION STRATEGY: Forces the project back to API 34 compatibility
// ADD THIS BLOCK AT THE VERY BOTTOM OF THE FILE
allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force "com.facebook.react:react-android:0.74.1" 
            force "com.facebook.react:hermes-android:0.74.1"
        }
    }
}


