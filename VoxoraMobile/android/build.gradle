buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 26
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.8.10"
    }
    repositories {
        google()
        mavenCentral() 
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.6.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        maven { url("$rootDir/../node_modules/react-native/android") }
        maven { url("$rootDir/../node_modules/jsc-android/dist") }
        
        google()
        mavenCentral() 
        
        maven {
            name 'ossrh-snapshot'
            url 'https://oss.sonatype.org/content/repositories/snapshots'
        }
        
        maven { url "https://www.jitpack.io" }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            if (project.name == 'react-native-voice_voice') {
                project.android { namespace = "com.wenkesj.voice" }
            }
            if (project.name == 'react-native-webrtc') {
                project.android { namespace = "com.oney.WebRTCModule" }
            }

            project.android {
                if (namespace == null) {
                    try {
                        namespace = project.group
                    } catch (Exception e) {
                        namespace = "com.voxora.generated.${project.name.replace("-", "_")}"
                    }
                }

                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }

            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).all {
                kotlinOptions {
                    jvmTarget = "17"
                    freeCompilerArgs += [
                        "-Xskip-prerelease-check", 
                        "-Xallow-unstable-dependencies",
                        "-Xno-call-assertions",
                        "-Xno-param-assertions"]
                }
            }
        }
    }
}

allprojects {
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core:1.13.1'
            force 'androidx.core:core-ktx:1.13.1'
            force "com.facebook.react:react-android:0.74.1" 
            force "com.facebook.react:hermes-android:0.74.1"
        }
    }
}