apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-android"

/**
 * The react { } block for the New Architecture / New Gradle Plugin.
 */
react {
    /* Hermes Commands */
    hermesCommand = "../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.voxoramobile"
    
    defaultConfig {
        applicationId "com.voxoramobile"
        // Linked to your project-level build.gradle ext (Min 21 for TTS/Camera)
        minSdk rootProject.ext.minSdkVersion 
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging') == 'true' ?: true)
        }
        // Conflict resolution for VisionCamera, Worklets, and TFLite
        pickFirst '**/libVisionCamera.so'
        pickFirst '**/libworklets.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libhermes.so'
        
        pickFirst 'lib/**/libtensorflowlite_flex_jni.so'
        pickFirst 'lib/**/libtensorflowlite_jni.so'
        
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Using debug signing for rapid prototype testing
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android") 
    } else {
        implementation jscFlavor
    }
    
    // Core Voxora Native Dependencies
    implementation project(':react-native-worklets-core')
    implementation project(':react-native-fast-tflite')
    implementation 'com.google.mlkit:face-detection:16.1.7'
    
    // Stable TFLite versions for 2026 deployment
    implementation 'com.google.mlkit:face-mesh-detection:16.0.0-beta3'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    implementation 'org.tensorflow:tensorflow-lite-select-tf-ops:2.16.1'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// --- The "Silent Success" Build Hack ---
// Prevents the mapReleaseSourceSetPaths hang by handling bundling manually.
tasks.whenTaskAdded { task ->
    if (task.name == "createBundleReleaseJsAndAssets") {
        task.doFirst {
            println "🚀 VOXORA BUILD: Bypassing internal bundler... Using pre-generated assets."
        }
        task.enabled = true 
        task.actions = []   
    }
}