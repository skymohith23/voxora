apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-android"
/**
 * The react.gradle file registers a task for each build variant (e.g. bundleDebugJsAndAssets)
 * This handles the bridge between your JavaScript and Android.
 */
react {
    /* Standard settings for stable versions */
    hermesCommand = "../../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
}

def enableProguardInReleaseBuilds = false
// Updated to a stable JSC flavor
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.voxoramobile"
    defaultConfig {
        applicationId "com.voxoramobile"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    // ADDED: Force Java 17 compatibility for Java source code
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // ADDED: Force Java 17 compatibility for Kotlin source code
    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging') == 'true')
        }
        pickFirst '**/libVisionCamera.so'
        pickFirst '**/libworklets.so'
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libhermes.so'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The core React Native Android library
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android") 
    } else {
        implementation jscFlavor
    }
    implementation project(':react-native-worklets-core')
    implementation project(':react-native-fast-tflite')
}

// CRITICAL: This is the stable autolinking script that replaces the 0.84 'autolinkLibrariesWithApp'
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
tasks.configureEach { task ->
    if (task.name.contains("configureCMakeDebug") && task.project.name == "react-native-vision-camera") {
        task.depends_on(":react-native-worklets-core:bundleDebugAar")
    }
}
tasks.whenTaskAdded { task ->
    if (task.name.contains('configureCMakeDebug') && task.project.name == 'react-native-vision-camera') {
        task.depends_on(':react-native-worklets-core:bundleDebugAar')
    }
}